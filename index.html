<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>Night Shift - Arcade Racer</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f4dc;
      --muted: #9da99a;
      --lime: #d4f36a;
      --orange: #ff704d;
      --panel: #18211b;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background-color: #101713;
      background-image: radial-gradient(ellipse at 50% 15%, #344234 0, #18231d 39%, #101713 78%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .game-shell {
      width: min(100%, 840px);
      padding: 24px clamp(14px, 4vw, 34px) 22px;
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 auto 13px;
      max-width: 620px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      color: #142015;
      background: var(--lime);
      font-size: 23px;
      font-weight: 900;
      transform: skew(-8deg);
    }
    .eyebrow { margin: 0 0 3px; color: var(--lime); font-size: 10px; font-weight: 800; letter-spacing: 1.7px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(21px, 5vw, 29px); line-height: 1; font-weight: 900; letter-spacing: 0; text-transform: uppercase; }
    .best { color: var(--muted); text-align: right; font-size: 11px; line-height: 1.6; text-transform: uppercase; }
    .best strong { display: block; color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }

    .cabinet {
      width: min(100%, 620px);
      margin: auto;
      padding: 9px;
      border: 1px solid #56604b;
      background: #1a241d;
      box-shadow: 0 18px 60px #060b08aa, inset 0 0 0 1px #0c130f;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 0 8px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .hud-label { color: var(--muted); }
    .hud-value { color: var(--lime); font-size: 16px; font-variant-numeric: tabular-nums; }
    .status { display: flex; align-items: center; gap: 7px; color: var(--muted); }
    .status-light { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px #d4f36a99; }

    .screen {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: min(72vh, 690px);
      background: #354835;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(#0b110bb3, #101710d9);
      text-align: center;
    }
    .overlay[hidden] { display: none; }
    .dialog { width: min(100%, 330px); }
    .stamp { display: inline-block; margin-bottom: 14px; padding: 6px 9px; color: #152016; background: var(--lime); font-size: 10px; font-weight: 900; letter-spacing: 1px; transform: rotate(-2deg); }
    .dialog h2 { margin: 0; font-size: clamp(31px, 8vw, 48px); line-height: .94; font-weight: 900; text-transform: uppercase; }
    .dialog p { margin: 14px auto 20px; max-width: 260px; color: #c1cbb8; font-size: 14px; line-height: 1.55; }
    .action {
      min-width: 170px;
      min-height: 48px;
      border: 0;
      color: #121a12;
      background: var(--lime);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(7% 0, 100% 0, 100% 78%, 93% 100%, 0 100%, 0 22%);
    }
    .action:hover { background: #e3ff8b; }
    .action:focus-visible, .touch-key:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: min(100%, 620px);
      margin: 11px auto 0;
      color: #aab4a5;
      font-size: 11px;
    }
    .key { padding: 3px 6px; border: 1px solid #576250; color: var(--ink); background: #202a22; font-size: 10px; font-weight: 800; }
    .touch-controls { display: none; justify-content: center; gap: 20px; margin: 13px auto 0; }
    .touch-key {
      width: 66px;
      height: 46px;
      border: 1px solid #657259;
      color: var(--ink);
      background: #202a22;
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      touch-action: none;
    }
    .touch-key:active { color: #172016; background: var(--lime); }

    @media (max-width: 600px) {
      .game-shell { padding-top: 15px; }
      .screen { max-height: 62vh; }
      .footer { justify-content: center; text-align: center; }
      .footer .tip { display: none; }
      .touch-controls { display: flex; }
    }
    @media (max-height: 740px) and (min-width: 601px) {
      .game-shell { padding-top: 12px; padding-bottom: 12px; }
      .screen { max-height: 68vh; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div><p class="eyebrow">After hours arcade</p><h1>Night Shift</h1></div>
      </div>
      <div class="best">Personal best<strong id="best-score">00000</strong></div>
    </header>

    <section class="cabinet" aria-label="Night Shift car game">
      <div class="hud">
        <div><span class="hud-label">Distance</span> <span class="hud-value" id="score">00000</span></div>
        <div class="status"><span class="status-light"></span><span id="status-text">Ready</span></div>
      </div>
      <div class="screen" id="screen">
        <canvas id="game" aria-label="Top-down road game. Avoid the other cars."></canvas>
        <div class="overlay" id="overlay">
          <div class="dialog">
            <span class="stamp">ONE MORE RUN</span>
            <h2 id="overlay-title">Own the<br>night.</h2>
            <p id="overlay-copy">Dodge the traffic. Keep your wheels clean. See how far this shift takes you.</p>
            <button class="action" id="start-button" type="button">Start your engine</button>
          </div>
        </div>
      </div>
    </section>

    <div class="footer"><span><span class="key">←</span> <span class="key">→</span> or <span class="key">A</span> <span class="key">D</span> to steer</span><span class="tip">Avoid traffic. Don't lift.</span></div>
    <div class="touch-controls" aria-label="Steering controls">
      <button class="touch-key" type="button" data-steer="-1" aria-label="Steer left">←</button>
      <button class="touch-key" type="button" data-steer="1" aria-label="Steer right">→</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const context = canvas.getContext('2d');
      const screen = document.getElementById('screen');
      const overlay = document.getElementById('overlay');
      const startButton = document.getElementById('start-button');
      const scoreElement = document.getElementById('score');
      const bestElement = document.getElementById('best-score');
      const statusText = document.getElementById('status-text');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayCopy = document.getElementById('overlay-copy');
      const colors = ['#ff704d', '#f1c75b', '#76c4a2', '#c5d2db'];
      const keys = new Set();
      let width = 0;
      let height = 0;
      let running = false;
      let lastTime = 0;
      let roadOffset = 0;
      let score = 0;
      let spawnTimer = 0;
      let traffic = [];
      let player = { x: 0, y: 0, width: 34, height: 58, lane: 1 };
      let best = Number(localStorage.getItem('night-shift-best') || 0);

      bestElement.textContent = formatScore(best);

      function formatScore(value) {
        return String(Math.floor(value)).padStart(5, '0');
      }

      function resize() {
        const bounds = screen.getBoundingClientRect();
        const scale = window.devicePixelRatio || 1;
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);
        player.width = Math.max(27, width * 0.073);
        player.height = player.width * 1.72;
        player.y = height * 0.77;
        player.x = laneCenter(player.lane);
        draw();
      }

      function laneCenter(lane) {
        const roadWidth = width * 0.72;
        const roadLeft = (width - roadWidth) / 2;
        return roadLeft + roadWidth * (lane + 0.5) / 3;
      }

      function drawCar(x, y, carWidth, carHeight, color, isPlayer) {
        const left = x - carWidth / 2;
        context.fillStyle = '#101510';
        context.fillRect(left - 3, y + 9, 5, 13);
        context.fillRect(left + carWidth - 2, y + 9, 5, 13);
        context.fillRect(left - 3, y + carHeight - 21, 5, 13);
        context.fillRect(left + carWidth - 2, y + carHeight - 21, 5, 13);
        context.fillStyle = color;
        context.beginPath();
        context.roundRect(left, y, carWidth, carHeight, 7);
        context.fill();
        context.fillStyle = isPlayer ? '#d9e9d8' : '#d3d7ce';
        context.beginPath();
        context.roundRect(left + carWidth * 0.18, y + carHeight * 0.19, carWidth * 0.64, carHeight * 0.27, 4);
        context.fill();
        context.fillStyle = isPlayer ? '#203a33' : '#343a35';
        context.beginPath();
        context.roundRect(left + carWidth * 0.19, y + carHeight * 0.53, carWidth * 0.62, carHeight * 0.19, 3);
        context.fill();
        context.fillStyle = isPlayer ? '#f2e98e' : '#ef5e49';
        context.fillRect(left + carWidth * 0.12, y + (isPlayer ? 3 : carHeight - 6), carWidth * 0.22, 3);
        context.fillRect(left + carWidth * 0.66, y + (isPlayer ? 3 : carHeight - 6), carWidth * 0.22, 3);
        if (isPlayer) {
          context.fillStyle = '#ffffff33';
          context.fillRect(left + carWidth * 0.46, y + 5, carWidth * 0.08, carHeight - 10);
        }
      }

      function draw() {
        if (!width || !height) return;
        context.clearRect(0, 0, width, height);
        context.fillStyle = '#49614a';
        context.fillRect(0, 0, width, height);

        for (let y = -36 + (roadOffset % 72); y < height; y += 72) {
          context.fillStyle = '#78905a';
          context.fillRect(width * 0.075, y, 4, 22);
          context.fillRect(width * 0.9, y + 28, 3, 18);
          context.fillStyle = '#2e4639';
          context.beginPath();
          context.arc(width * 0.16, y + 37, 5, 0, Math.PI * 2);
          context.arc(width * 0.84, y + 4, 7, 0, Math.PI * 2);
          context.fill();
        }

        const roadWidth = width * 0.72;
        const roadLeft = (width - roadWidth) / 2;
        context.fillStyle = '#333a35';
        context.fillRect(roadLeft, 0, roadWidth, height);
        context.fillStyle = '#e5d982';
        context.fillRect(roadLeft + 4, 0, 3, height);
        context.fillRect(roadLeft + roadWidth - 7, 0, 3, height);
        context.fillStyle = '#666a58';
        context.fillRect(roadLeft + 10, 0, 2, height);
        context.fillRect(roadLeft + roadWidth - 12, 0, 2, height);
        context.fillStyle = '#9ca28a';
        for (let lane = 1; lane < 3; lane++) {
          const lineX = roadLeft + roadWidth * lane / 3;
          for (let y = -42 + (roadOffset % 84); y < height; y += 84) {
            context.fillRect(lineX - 1, y, 2, 39);
          }
        }

        traffic.forEach((car) => drawCar(car.x, car.y, player.width * 0.94, player.height * 0.95, car.color, false));
        drawCar(player.x, player.y, player.width, player.height, '#8fca80', true);
      }

      function startGame() {
        score = 0;
        spawnTimer = 0;
        roadOffset = 0;
        traffic = [];
        player.lane = 1;
        player.x = laneCenter(player.lane);
        running = true;
        lastTime = performance.now();
        scoreElement.textContent = formatScore(score);
        statusText.textContent = 'On shift';
        overlay.hidden = true;
        requestAnimationFrame(update);
      }

      function endGame() {
        running = false;
        const finalScore = Math.floor(score);
        if (finalScore > best) {
          best = finalScore;
          localStorage.setItem('night-shift-best', String(best));
          bestElement.textContent = formatScore(best);
        }
        statusText.textContent = 'Shift over';
        overlayTitle.innerHTML = 'Shift<br>over.';
        overlayCopy.textContent = `You made it ${formatScore(finalScore)} metres. The road is still calling.`;
        startButton.textContent = 'Take another run';
        overlay.hidden = false;
      }

      function update(time) {
        if (!running) return;
        const delta = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        const speed = 260 + Math.min(score * 0.34, 230);
        roadOffset = (roadOffset + speed * delta) % 84;
        score += delta * 10;
        scoreElement.textContent = formatScore(score);

        if (keys.has('ArrowLeft') || keys.has('a')) player.lane = Math.max(0, player.lane - 1);
        if (keys.has('ArrowRight') || keys.has('d')) player.lane = Math.min(2, player.lane + 1);
        player.x += (laneCenter(player.lane) - player.x) * Math.min(1, delta * 13);

        spawnTimer += delta;
        const spawnInterval = Math.max(0.48, 1.05 - score / 1800);
        if (spawnTimer >= spawnInterval) {
          spawnTimer = 0;
          const lane = Math.floor(Math.random() * 3);
          const blocked = traffic.some((car) => car.lane === lane && car.y < height * 0.34);
          if (!blocked) traffic.push({ lane, x: laneCenter(lane), y: -player.height - 8, color: colors[Math.floor(Math.random() * colors.length)] });
        }

        traffic.forEach((car) => { car.y += speed * delta; car.x = laneCenter(car.lane); });
        traffic = traffic.filter((car) => car.y < height + player.height);
        const playerLeft = player.x - player.width * 0.36;
        const playerRight = player.x + player.width * 0.36;
        const playerTop = player.y + 5;
        const playerBottom = player.y + player.height - 4;
        const crashed = traffic.some((car) => {
          const carWidth = player.width * 0.94;
          const carHeight = player.height * 0.95;
          return playerLeft < car.x + carWidth * 0.36 && playerRight > car.x - carWidth * 0.36 && playerTop < car.y + carHeight - 5 && playerBottom > car.y + 5;
        });
        draw();
        if (crashed) endGame();
        else requestAnimationFrame(update);
      }

      startButton.addEventListener('click', startGame);
      window.addEventListener('resize', resize);
      window.addEventListener('keydown', (event) => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (!keys.has(key) && ['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(key)) keys.add(key);
        if (!running && event.key === 'Enter') startGame();
      });
      window.addEventListener('keyup', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });
      window.addEventListener('blur', () => keys.clear());

      document.querySelectorAll('[data-steer]').forEach((button) => {
        const steer = button.dataset.steer === '-1' ? 'ArrowLeft' : 'ArrowRight';
        button.addEventListener('pointerdown', (event) => { event.preventDefault(); keys.add(steer); });
        for (const eventName of ['pointerup', 'pointercancel', 'pointerleave']) {
          button.addEventListener(eventName, () => keys.delete(steer));
        }
      });

      resize();
    })();
  </script>
</body>
</html>
